name: Dnevno osvježavanje cijena

on:
  schedule:
    # 09:20 UTC = 11:20 po hrvatskom ljetnom vremenu; trgovci objavljuju do 8:00.
    - cron: "20 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Obradi podatke s cijene.dev
        run: python pipeline/build.py --out site/data

      - name: Složi stranicu
        run: cp index.html site/index.html

      # Latest data also goes to the "data" branch (one commit, overwritten daily)
      # so it can be inspected without growing the repository.
      - name: Spremi podatke u granu data
        run: |
          cd site/data
          git init -q -b data
          git config user.name "cjenoskop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Podaci za $(jq -r .date meta.json)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
